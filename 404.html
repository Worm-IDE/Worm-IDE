<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Redirecting...</title>

    <!-- 1. HTML Fallback: Redirects after 0 seconds if JavaScript is disabled -->
    <noscript>
        <meta http-equiv="refresh" content="0; url=https://Worm-IDE.github.io/Worm-IDE" />
    </noscript>

    <!-- 2. JavaScript Redirect: Executes immediately before the page finishes loading -->
    <script type="text/javascript">
        window.location.replace("https://");
    </script>
</head>
<body>
    <p>If you are not redirected automatically, follow this <a href="/index.html">link to the new page</a>.</p>
</body>
</html>
