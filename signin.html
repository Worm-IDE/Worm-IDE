<svg xmlns="http://w3.org" viewBox="0 0 800 600" width="100%" height="100%">
  <!-- Background Style -->
  <style>
    .bg { fill: #f4f7f6; }
    .desk { fill: #e0dcd3; stroke: #b5b0a1; stroke-width: 4; }
    .worm { fill: #ff7597; stroke: #c23b5d; stroke-width: 4; stroke-linejoin: round; }
    .worm-belly { fill: #ff9ebb; }
    .glasses { fill: none; stroke: #333333; stroke-width: 5; }
    .glass-lens { fill: #e0f7fa; fill-opacity: 0.6; }
    .computer { fill: #78909c; stroke: #37474f; stroke-width: 4; stroke-linejoin: round; }
    .screen { fill: #263238; }
    .keyboard { fill: #cfd8dc; }
    .key-lines { stroke: #b0bec5; stroke-width: 3; stroke-linecap: round; }
    .motion-line { stroke: #37474f; stroke-width: 3; stroke-linecap: round; fill: none; }
  </style>

  <!-- Background -->
  <rect width="800" height="600" class="bg" />
  
  <!-- Desk -->
  <path d="M 50 480 L 750 480 L 700 550 L 100 550 Z" class="desk" />

  <!-- Laptop Computer -->
  <g id="laptop">
    <!-- Laptop Screen (Open) -->
    <path d="M 420 280 L 580 260 L 560 440 L 410 450 Z" class="computer" />
    <!-- Screen Display -->
    <path d="M 430 295 L 565 278 L 548 430 L 422 438 Z" class="screen" />
    <!-- Code lines on screen -->
    <path d="M 440 310 L 500 302" stroke="#4caf50" stroke-width="4" stroke-linecap="round" />
    <path d="M 445 330 L 530 320" stroke="#00bcd4" stroke-width="4" stroke-linecap="round" />
    <path d="M 442 350 L 480 345" stroke="#ffeb3b" stroke-width="4" stroke-linecap="round" />
    <path d="M 450 370 L 540 358" stroke="#4caf50" stroke-width="4" stroke-linecap="round" />
    
    <!-- Laptop Base & Keyboard -->
    <path d="M 410 450 L 560 440 L 520 490 L 350 500 Z" class="computer" />
    <path d="M 415 455 L 545 446 L 512 482 L 365 491 Z" class="keyboard" />
    <!-- Keyboard Keys Grid Lines -->
    <path d="M 400 465 L 525 455 M 390 475 L 520 465 M 380 485 L 515 475" class="key-lines" />
    <path d="M 410 455 L 370 490 M 440 453 L 410 487 M 480 450 L 450 484 M 510 448 L 490 480" class="key-lines" />
  </g>

  <!-- The Worm -->
  <g id="worm-character">
    <!-- Worm Tail & Lower Body Segments -->
    <path d="M 150 480 C 130 450, 140 400, 180 400 C 220 400, 210 460, 250 460 C 290 460, 280 380, 320 380 C 360 380, 350 460, 390 460 C 410 460, 420 440, 430 440" fill="none" class="worm" stroke-width="45" stroke-linecap="round" />
    
    <!-- Worm Belly Details (Inner pink accents for depth) -->
    <path d="M 175 410 C 195 410, 200 450, 245 450 C 285 450, 285 390, 320 390 C 345 390, 345 450, 385 450" fill="none" class="worm-belly" stroke-width="15" stroke-linecap="round" />

    <!-- Worm Neck & Head rising up -->
    <path d="M 230 440 C 250 350, 220 250, 280 200 C 330 160, 380 220, 360 280" fill="none" class="worm" stroke-width="50" stroke-linecap="round" />

    <!-- Worm Face Elements -->
    <!-- Eyes -->
    <circle cx="315" cy="210" r="6" fill="#333333" />
    <circle cx="345" cy="215" r="6" fill="#333333" />
    <!-- Blush -->
    <circle cx="300" cy="225" r="10" fill="#ff4081" opacity="0.4" />
    <circle cx="355" cy="230" r="10" fill="#ff4081" opacity="0.4" />
    <!-- Happy Smile -->
    <path d="M 322 230 Q 330 240 338 232" fill="none" stroke="#333333" stroke-width="3" stroke-linecap="round" />

    <!-- Glasses -->
    <circle cx="312" cy="212" r="18" class="glass-lens" />
    <circle cx="312" cy="212" r="18" class="glasses" />
    <circle cx="348" cy="217" r="18" class="glass-lens" />
    <circle cx="348" cy="217" r="18" class="glasses" />
    <path d="M 330 215 L 333 215" class="glasses" /> <!-- Bridge -->
    <path d="M 294 212 L 280 215" class="glasses" /> <!-- Left Ear Piece -->

    <!-- Typing Hands / Front Tentacles -->
    <!-- Left Hand reaching to keyboard -->
    <path d="M 270 290 Q 310 320, 360 410 Q 370 430, 395 445" fill="none" class="worm" stroke-width="20" stroke-linecap="round" />
    <!-- Right Hand reaching to keyboard -->
    <path d="M 290 300 Q 340 310, 380 390 Q 400 415, 425 435" fill="none" class="worm" stroke-width="20" stroke-linecap="round" />
  </g>

  <!-- Typing Motion Lines (Action Indicators) -->
  <g id="typing-effects">
    <!-- Left hand action -->
    <path d="M 385 430 Q 380 420, 375 432" class="motion-line" />
    <path d="M 400 435 Q 395 425, 390 437" class="motion-line" />
    <!-- Right hand action -->
    <path d="M 420 420 Q 422 410, 428 418" class="motion-line" />
    <path d="M 435 425 Q 437 415, 443 423" class="motion-line" />
  </g>
</svg>
