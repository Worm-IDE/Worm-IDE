<!DOCTYPE html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Worm IDE Scratch ➡️ Linux packager</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000;
    }
    #player-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
  </style>
</head>
<body>

  <div id="player-container">
    <canvas id="stage"></canvas>
  </div>

  <!-- Include open-source scratch player runtime engine engine scripts -->
  <script src="https://github.io"></script>
  <script src="https://github.io"></script>
  
  <script>
    // Automatically load the embedded project asset compiled into this project folder
    P.runtime.loadProjectFromFile('project.sb3', function(err, stage) {
      if (err) {
        console.error("Failed to load project:", err);
        return;
      }
      // Attach to screen visual wrapper and automatically execute execution thread
      stage.attach(document.getElementById('stage'));
      P.stage.start();
    });
</body>
</html>
